  <meta property="og:description" content="두 캐릭터와 관계를 한 장에 기록해보세요.">

  <meta name="twitter:title" content="WeLog — Pair Sheet Maker">

<body>
  <header class="topbar">
    <a class="brand" href="#"><span>✦</span><b>WeLog</b><small>PAIR SHEET MAKER</small></a>
    <span class="autosave"><i></i>자동 저장됨</span>
    <div class="top-actions">
      <button id="slotBtn">슬롯</button>
      <div class="zoom"><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">＋</button><button id="zoomReset">초기화</button></div>
      <button id="previewBtn">미리보기</button>
      <button class="primary" id="pngBtn">↓ PNG 저장</button>
    </div>
  </header>
  <main class="app">
    <section class="workspace"><div class="sheet-holder" id="sheetHolder"><article id="sheet" class="sheet"></article></div></section>
    <aside class="inspector">
      <header><small>QUICK EDIT</small><b>시트 수정</b><span>WeLog</span></header>
      <nav id="tabs"></nav>
      <section id="controls" class="controls"></section>
    </aside>
  </main>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="./welog-v2.js?v=28"></script>
</body>
