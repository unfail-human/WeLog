<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dedbd4">
  <title>WeLog — Pair Sheet Maker</title>
  <meta name="description" content="두 캐릭터와 관계를 한 장에 기록하는 페어 시트 메이커 WeLog">
  <meta property="og:title" content="WeLog — Pair Sheet Maker">
  <meta property="og:description" content="두 캐릭터와 관계를 한 장에 기록해보세요.">
  <meta property="og:image" content="./assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="./assets/og-image.png">
  <link rel="icon" href="./assets/favicon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="WeLog"><span>✦</span><b>WeLog</b><small>PAIR SHEET MAKER</small></a>
    <div class="top-actions">
      <button id="previewBtn">미리보기</button>
      <button id="saveDataBtn">저장</button>
      <label class="button">불러오기<input id="loadData" type="file" accept=".json"></label>
      <button class="primary" id="printBtn">↓ PDF 저장</button>
    </div>
  </header>
  <main class="app">
    <section class="stage">
      <div class="stage-top"><div><b>PAIR SHEET</b><span>두 캐릭터의 시트를 편집해보세요.</span></div></div>
      <nav class="utility-dock" aria-label="빠른 도구">
        <button id="slotOpenBtn" type="button"><b>⇅</b><small>슬롯</small></button>
      </nav>
      <div id="sheet" class="sheet"></div>
    </section>
    <aside id="editor" class="inspector">
      <div class="inspector-head"><div><small>QUICK EDIT</small><b>시트 수정</b></div><span>WeLog</span></div>
      <nav id="tabs" class="inspector-tabs"></nav>
      <section id="controls" class="controls"></section>
    </aside>
  </main>
  <div class="slot-drawer" id="slotDrawer" hidden>
    <button class="slot-backdrop" id="slotBackdrop" type="button" aria-label="슬롯 닫기"></button>
    <section class="slot-panel">
      <div class="slot-panel-head"><div><small>ARCHIVE</small><b>작업 슬롯</b></div><button id="slotCloseBtn" type="button">×</button></div>
      <p>이미지를 제외한 텍스트와 설정만 저장합니다.</p>
      <div id="slotPanel"></div>
    </section>
  </div>
  <script src="./script.js"></script>
</body>
</html>
